<div class="container-fluid py-4 px-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0"><i class="bi bi-people-fill me-1"></i> 👥 Employee Management</h4>
    <a routerLink="/employees/add" class="btn btn-primary btn-sm">
      <i class="bi bi-person-plus-fill me-1"></i> 📝 Add Employee
    </a>
  </div>

  <div *ngIf="successMessage" class="alert alert-success alert-dismissible py-2">
    {{ successMessage }}
    <button type="button" class="btn-close" (click)="successMessage=''"></button>
  </div>
  <div *ngIf="error" class="alert alert-danger alert-dismissible py-2">
    {{ error }}
    <button type="button" class="btn-close" (click)="error=''"></button>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading&#x2026;</span></div>
  </div>

  <div class="card shadow-sm mb-4" *ngIf="!loading && employees.length > 0">
    <div class="card-header">📊 Insights</div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6"><div style="position:relative;height:240px;"><canvas id="employeesByRoleChart"></canvas></div></div>
        <div class="col-md-6"><div style="position:relative;height:240px;"><canvas id="employeesByGradeChart"></canvas></div></div>
      </div>
    </div>
  </div>

  <div *ngIf="!loading" class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Grade</th><th>Status</th><th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let emp of employees">
              <td class="fw-semibold">{{ emp.employeeId }}</td>
              <td>{{ emp.firstName }}</td>
              <td>{{ emp.emailAddress }}</td>
              <td>
                <span class="badge"
                  [class.bg-danger]="emp.role==='HR'"
                  [class.bg-success]="emp.role==='Employee'"
                  [class.bg-info]="emp.role==='TravelDeskExe'">
                  {{ emp.role }}
                </span>
              </td>
              <td>{{ emp.gradeName }}</td>
              <td>
                <span [class.text-success]="emp.accessGranted" [class.text-danger]="!emp.accessGranted">
                  <ng-container *ngIf="emp.accessGranted"><i class="bi bi-check-circle-fill me-1"></i> Active</ng-container>
                  <ng-container *ngIf="!emp.accessGranted"><i class="bi bi-x-circle-fill me-1"></i> Inactive</ng-container>
                </span>
              </td>
              <td class="text-center">
                <a [routerLink]="['/employees', emp.employeeId, 'change-grade']"
                   class="btn btn-outline-primary btn-sm me-1">Change Grade</a>
                <button class="btn btn-outline-danger btn-sm"
                  (click)="deleteEmployee(emp.employeeId, emp.firstName)">Delete</button>
              </td>
            </tr>
            <tr *ngIf="employees.length === 0">
              <td colspan="7" class="text-center text-muted py-4">👥 No employees found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
